name: Deploy HiveFlow web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build GitHub Pages web app
        env:
          HIVEFLOW_API_URL: ${{ vars.HIVEFLOW_API_URL }}
        run: >-
          flutter build web --release
          --base-href "/HiveFlow-/"
          --dart-define=HIVEFLOW_API_URL="$HIVEFLOW_API_URL"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
